name: Daily NSE Scan

on:
  schedule:
    # 11:30 UTC is 5:00 PM IST
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Generate Market Data
        run: npm run generate
        
      - name: Commit Updated Market Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market_data.json
          git commit -m "Automated daily market data update" || echo "No changes to commit"
          git push
          
      - name: Build Application
        run: npm run build
        
      - name: Deploy to GitHub Pages
        run: npx gh-pages@6.1.0 -d dist --repo https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
